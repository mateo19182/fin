[project]
name = "fin"
version = "0.1.0"
description = "Personal finance on a plain-text beancount ledger"
requires-python = ">=3.12"
dependencies = [
    "beancount>=3.1",
    "beanquery>=0.2",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.9",
    "pyjwt>=2.9",
    "cryptography>=43",
    "requests>=2.32",
    "yfinance>=0.2.50",
    "anthropic>=2.3.0",
]

[project.scripts]
fin = "fin.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fin"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p tests.ui_fixtures"
